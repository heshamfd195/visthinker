<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080" width="1500" height="1080">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8e8e8"/></marker></defs>
<rect width="1500" height="1080" rx="12" fill="#121212"/>
<text x="40" y="48.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#e8e8e8">Handwriting ability: how an A is read</text>
<text x="40" y="75.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#a3a3a3">The Fast Brain reads clear letters by their structure. Claude reads what it isn&#x27;t sure of. Weights are a first draft to tune.</text>
<rect x="40" y="100" width="238" height="90" rx="12" fill="#3a3320" stroke="#e8e8e8" stroke-width="2"/>
<text x="159.0" y="139.2" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">1 · Strokes in</text>
<text x="159.0" y="161.29999999999998" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">raw points, never smoothed</text>
<rect x="318" y="100" width="238" height="90" rx="12" fill="#1b2a38" stroke="#e8e8e8" stroke-width="2"/>
<text x="437.0" y="128.8" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">2 · Group</text>
<text x="437.0" y="150.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">strokes close in place</text>
<text x="437.0" y="169.1" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">and time = one letter</text>
<path d="M278,145.0 L318,145.0" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<rect x="596" y="100" width="238" height="90" rx="12" fill="#1b2a38" stroke="#e8e8e8" stroke-width="2"/>
<text x="715.0" y="128.8" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">3 · Features</text>
<text x="715.0" y="150.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">lines, angles, meets,</text>
<text x="715.0" y="169.1" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">crossings, loops</text>
<path d="M556,145.0 L596,145.0" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<rect x="874" y="100" width="238" height="90" rx="12" fill="#1b2a38" stroke="#e8e8e8" stroke-width="2"/>
<text x="993.0" y="128.8" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">4 · Check cards</text>
<text x="993.0" y="150.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">every letter card</text>
<text x="993.0" y="169.1" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">gives a score</text>
<path d="M834,145.0 L874,145.0" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<rect x="1152" y="100" width="238" height="90" rx="12" fill="#29243d" stroke="#e8e8e8" stroke-width="2"/>
<text x="1271.0" y="128.8" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">5 · Decide</text>
<text x="1271.0" y="150.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">a clear winner is labelled,</text>
<text x="1271.0" y="169.1" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">anything else goes to Claude</text>
<path d="M1112,145.0 L1152,145.0" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<text x="40" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#e8e8e8">An A, as the Fast Brain sees it</text>
<path d="M120,560 L220,290" fill="none" stroke="#e8e8e8" stroke-width="6" stroke-linecap="round"/>
<path d="M220,290 L320,560" fill="none" stroke="#e8e8e8" stroke-width="6" stroke-linecap="round"/>
<path d="M152,455 L290,450" fill="none" stroke="#e8e8e8" stroke-width="6" stroke-linecap="round"/>
<circle cx="220" cy="290" r="14" fill="none" stroke="#ffa94d" stroke-width="3"/>
<circle cx="156" cy="455" r="10" fill="none" stroke="#4dabf7" stroke-width="3"/>
<circle cx="286" cy="451" r="10" fill="none" stroke="#4dabf7" stroke-width="3"/>
<text x="136" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#b197fc">1</text>
<text x="290" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#b197fc">2</text>
<text x="214" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#b197fc">3</text>
<text x="245" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#ffa94d">legs meet at the top</text>
<text x="330" y="454.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4dabf7">the bar crosses</text>
<text x="330" y="472.2" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4dabf7">both legs</text>
<text x="40" y="604.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#a3a3a3">two long legs, slanting toward each other (about 60–80° from flat),</text>
<text x="40" y="622.2" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#a3a3a3">open at the bottom; the bar sits 35–70% of the way down</text>
<path d="M110,290 L340,290" fill="none" stroke="#a3a3a3" stroke-width="1" stroke-linecap="round" stroke-dasharray="8 6"/>
<path d="M110,560 L340,560" fill="none" stroke="#a3a3a3" stroke-width="1" stroke-linecap="round" stroke-dasharray="8 6"/>
<rect x="520" y="230" width="440" height="410" rx="12" fill="#1b2a38" stroke="#e8e8e8" stroke-width="2"/>
<text x="740.0" y="439.6" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8"></text>
<text x="544" y="267.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#e8e8e8">Card: A</text>
<text x="544" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#e8e8e8">✓ 2 or 3 strokes (an ∧ and a bar counts)</text>
<text x="904" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#69db7c">10</text>
<text x="544" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#e8e8e8">✓ two long legs, slanting opposite ways</text>
<text x="904" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#69db7c">25</text>
<text x="544" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#e8e8e8">✓ the legs meet at the top</text>
<text x="904" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#69db7c">25</text>
<text x="544" y="484.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#e8e8e8">✓ a short bar crosses both legs</text>
<text x="904" y="484.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#69db7c">25</text>
<text x="544" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#e8e8e8">✓ the bar sits in the middle band</text>
<text x="904" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#69db7c">15</text>
<path d="M544,582 L936,582" fill="none" stroke="#a3a3a3" stroke-width="1" stroke-linecap="round"/>
<text x="544" y="612.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#a3a3a3">a perfect A scores</text>
<text x="894" y="612.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#69db7c">100</text>
<text x="1000" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#e8e8e8">Decide</text>
<rect x="1000" y="270" width="400" height="84" rx="12" fill="#1b2a38" stroke="#e8e8e8" stroke-width="2"/>
<text x="1200.0" y="306.2" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">This A: 92</text>
<text x="1200.0" y="328.3" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">next best: H 48 · a lead of 44</text>
<rect x="1000" y="400" width="400" height="84" rx="12" fill="#1c3122" stroke="#e8e8e8" stroke-width="2"/>
<text x="1200.0" y="436.2" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">Clear: 70 or more, a lead of 15+</text>
<text x="1200.0" y="458.3" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">label it A 92% at once</text>
<rect x="1000" y="530" width="400" height="110" rx="12" fill="#29243d" stroke="#e8e8e8" stroke-width="2"/>
<text x="1200.0" y="558.4" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">Unsure: under 70, or a near tie</text>
<text x="1200.0" y="580.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">show ? at once, send Claude the two</text>
<text x="1200.0" y="598.7" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">best guesses and the word around it;</text>
<text x="1200.0" y="616.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">Claude&#x27;s answer replaces the ?</text>
<path d="M1200.0,354 L1200.0,400" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<text x="1210.0" y="381.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#a3a3a3">clear</text>
<path d="M1400,312 L1428,312 L1428,585 L1400,585" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
<text x="1436" y="454.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#a3a3a3">unsure</text>
<text x="40" y="709.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#e8e8e8">Limits to handle</text>
<rect x="40" y="730" width="430" height="145" rx="12" fill="#3a2a1a" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="255.0" y="775.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">Orientation</text>
<text x="255.0" y="798.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">a tilted page or a rotated A breaks &#x27;slant&#x27;</text>
<text x="255.0" y="816.2" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">and &#x27;top&#x27;; measure them on the word&#x27;s</text>
<text x="255.0" y="834.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">own baseline, past about 30° ask Claude</text>
<rect x="500" y="730" width="430" height="145" rx="12" fill="#3a2a1a" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="715.0" y="775.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">Stroke count and order</text>
<text x="715.0" y="798.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">an A can be 1, 2 or 3 strokes, in any</text>
<text x="715.0" y="816.2" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">order; cards take a range, and order</text>
<text x="715.0" y="834.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">never counts</text>
<rect x="960" y="730" width="430" height="145" rx="12" fill="#3a2a1a" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1175.0" y="775.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">Gaps and overshoot</text>
<text x="1175.0" y="798.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">legs that almost meet, a bar that stops</text>
<text x="1175.0" y="816.2" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">short: meets and crossings get a</text>
<text x="1175.0" y="834.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">tolerance scaled to the letter&#x27;s size</text>
<rect x="40" y="895" width="430" height="145" rx="12" fill="#3a2a1a" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="255.0" y="940.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">Size and proportion</text>
<text x="255.0" y="963.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">tiny, tall or wide letters: every check</text>
<text x="255.0" y="981.2" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">uses ratios of the letter&#x27;s own box,</text>
<text x="255.0" y="999.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">never pixels</text>
<rect x="500" y="895" width="430" height="145" rx="12" fill="#3a2a1a" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="715.0" y="940.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">Look-alikes</text>
<text x="715.0" y="963.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">A, H, 4 and Λ share parts: the apex and</text>
<text x="715.0" y="981.2" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">the bar tell them apart; a near tie</text>
<text x="715.0" y="999.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">goes to Claude</text>
<rect x="960" y="895" width="430" height="145" rx="12" fill="#3a2a1a" stroke="#e8e8e8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1175.0" y="940.9" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#e8e8e8">Joined-up writing</text>
<text x="1175.0" y="963.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">letters that run together can&#x27;t be split</text>
<text x="1175.0" y="981.2" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">by gaps, so the whole word goes to</text>
<text x="1175.0" y="999.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#a3a3a3">Claude</text>
</svg>
