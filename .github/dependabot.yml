# Security fixes come as soon as they're found; version updates once a month,
# grouped into one PR per ecosystem (D106).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; lift this when it does.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
